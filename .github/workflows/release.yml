name: release

# A `vX.Y.Z` tag publishes every non-private package in packages/ to npm at that version.
# GitHub runs releases; forge runs CI and review. On forge this workflow does nothing.
#
# npm trusts this workflow through OIDC (trusted publishing), so no npm token is stored.
# Bootstrap once per package: publish it by hand, add this repository's `release.yml` and the
# `npm` environment as its trusted publisher on npmjs.com, then set the repository variable
# NPM_PUBLISH_ENABLED to `true`. Until then the publish job is skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  npm:
    needs: [check]
    if: github.server_url == 'https://github.com' && vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - name: Stamp the tag's version
        run: bun scripts/release-version.ts "$GITHUB_REF_NAME"
      - run: bun run build
      - name: Publish with provenance
        run: |
          for dir in packages/*/; do
            if [ "$(node -p "require('./${dir}package.json').private === true")" = true ]; then
              continue
            fi
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --ignore-scripts)
          done
