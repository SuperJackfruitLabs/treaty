# Shared release workflow for the SuperJackfruit suite. Master copy: estate release/workflow/.
# Every product carries this file byte-identical at .github/workflows/release.yml, plus the
# shared scripts under .github/release/. Everything product-specific is in
# .github/release-config.json. Do not edit a product's copy; change the master and sync it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Tag gate
    # A forge-primary product's GitHub mirror runs this; the forge itself never does.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      ci_source: ${{ steps.ci.outputs.source }}
      product: ${{ steps.config.outputs.product }}
      publish: ${{ steps.config.outputs.publish }}
      publish_environment: ${{ steps.config.outputs.publish_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read release config
        id: config
        run: |
          test -f .github/release-config.json || { echo "::error::no .github/release-config.json"; exit 1; }
          c=.github/release-config.json
          jq -e '.product and (.ci_workflow or .ci.forge or .ci.check_command)' "$c" >/dev/null ||
            { echo "::error::release-config.json needs product, and ci_workflow or ci"; exit 1; }
          if jq -e '.artifact and (.ci_workflow | not)' "$c" >/dev/null; then
            echo "::error::artifact needs ci_workflow: only a GitHub CI run uploads builds"; exit 1
          fi
          if jq -e '.publish and ((.publish.script and .publish.environment) | not)' "$c" >/dev/null; then
            echo "::error::publish needs script and environment"; exit 1
          fi
          {
            echo "product=$(jq -r .product "$c")"
            echo "publish=$(jq -r 'if .publish then "true" else "false" end' "$c")"
            echo "publish_environment=$(jq -r '.publish.environment // empty' "$c")"
          } >> "$GITHUB_OUTPUT"
      - name: Tag is vX.Y.Z
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ||
            { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
      # fetch-depth 0 already brought origin/main. A second fetch would need credentials, which
      # checkout does not keep, and a private repository refuses it.
      - name: Tag commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: Main CI passed for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_STATUS_TOKEN: ${{ secrets.FORGE_STATUS_TOKEN }}
        run: |
          wf=$(jq -r '.ci_workflow // empty' .github/release-config.json)
          if [ -z "$wf" ]; then
            sh .github/release/ci-gate.sh .github/release-config.json "$GITHUB_SHA"
            exit 0
          fi
          echo "source=github" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&branch=main&status=success&per_page=1" \
            -q '.workflow_runs[0].id // empty')
          [ -n "$run" ] || { echo "::error::no successful $wf run on main for $GITHUB_SHA"; exit 1; }
          echo "run_id=$run" >> "$GITHUB_OUTPUT"
          echo "main CI run $run passed for $GITHUB_SHA"
      - name: Set up Bun for the check at the tag
        if: steps.ci.outputs.source == 'tag' && hashFiles('.bun-version') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check at the tag (main's CI result could not be read)
        if: steps.ci.outputs.source == 'tag'
        run: sh -c "$(jq -r '.ci.check_command' .github/release-config.json)"

  publish:
    name: Publish ${{ needs.gate.outputs.product }} ${{ github.ref_name }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.gate.outputs.publish_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Set up Bun
        if: hashFiles('.bun-version') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Publish
        run: sh "$(jq -r '.publish.script' .github/release-config.json)"

  release:
    name: Release ${{ needs.gate.outputs.product }} ${{ github.ref_name }}
    needs: [gate, publish]
    # Runs after a successful publish, or when the product publishes nothing.
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      CONFIG: .github/release-config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Which build to ship
        id: plan
        run: |
          artifact=$(jq -r '.artifact // empty' "$CONFIG" | sed "s/{sha}/$GITHUB_SHA/g")
          build=$(jq -r '.build_at_tag // false' "$CONFIG")
          if [ -n "$artifact" ]; then echo "mode=artifact" >> "$GITHUB_OUTPUT"
          elif [ "$build" = true ]; then echo "mode=build" >> "$GITHUB_OUTPUT"
          else echo "mode=none" >> "$GITHUB_OUTPUT"; fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Fetch the build main's CI tested
        if: steps.plan.outputs.mode == 'artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: release-dist
          run-id: ${{ needs.gate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Set up Bun for the build
        if: steps.plan.outputs.mode == 'build' && hashFiles('.bun-version') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build at the tag (this product's main CI uploads no build yet)
        if: steps.plan.outputs.mode == 'build'
        run: |
          mkdir -p release-dist
          sh -c "$(jq -r '.build_command' "$CONFIG")"
          # Asset entries are globs on purpose.
          # shellcheck disable=SC2086
          for p in $(jq -r '.assets[]? // empty' "$CONFIG"); do cp -r $p release-dist/ 2>/dev/null || true; done

      - name: Checksums
        id: sums
        run: |
          mkdir -p release-dist
          if [ -n "$(ls -A release-dist)" ]; then
            (cd release-dist && find . -type f | sort | xargs sha256sum > ../SHA256SUMS.tmp)
            mv SHA256SUMS.tmp release-dist/SHA256SUMS
            echo "files=true" >> "$GITHUB_OUTPUT"
          else
            echo "files=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Provenance
        if: steps.sums.outputs.files == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-dist/**

      - name: Release notes — changelog section
        run: |
          : > changelog-section.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$TAG" '
              $0 ~ "^## " v "( |$)" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > changelog-section.md
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          echo "PREV=$prev" >> "$GITHUB_ENV"
          range=${prev:+$prev..}$TAG
          git log --no-merges --format='%s' "$range" > commit-log.txt
          git diff --stat "${prev:-$(git rev-list --max-parents=0 HEAD | tail -1)}" "$TAG" | tail -40 > diff-stat.txt
      - name: Release notes — grouped commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/release/cliff.toml
          args: ${{ env.PREV && format('{0}..{1}', env.PREV, env.TAG) || env.TAG }} --strip header
        env:
          OUTPUT: grouped.md
      - name: Release notes — summary (never blocks the release)
        continue-on-error: true
        env:
          RELEASE_SUMMARY_API_KEY: ${{ secrets.RELEASE_SUMMARY_API_KEY }}
          PRODUCT: ${{ needs.gate.outputs.product }}
        run: |
          RELEASE_SUMMARY_BASE_URL=$(jq -r '.summary.base_url // empty' "$CONFIG")
          RELEASE_SUMMARY_MODEL=$(jq -r '.summary.model // empty' "$CONFIG")
          export RELEASE_SUMMARY_BASE_URL RELEASE_SUMMARY_MODEL
          [ -n "$RELEASE_SUMMARY_BASE_URL" ] || unset RELEASE_SUMMARY_BASE_URL
          [ -n "$RELEASE_SUMMARY_MODEL" ] || unset RELEASE_SUMMARY_MODEL
          timeout 120 node .github/release/summarise.mjs --product "$PRODUCT" \
            --version "$TAG" --changelog changelog-section.md --log commit-log.txt \
            --stat diff-stat.txt --out summary.md || true
      - name: Release notes — assemble
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          CI_SOURCE: ${{ needs.gate.outputs.ci_source }}
        run: |
          {
            if [ -s summary.md ]; then echo "## Summary"; echo; cat summary.md; echo; fi
            if [ -s changelog-section.md ]; then echo "## Highlights"; echo; cat changelog-section.md; echo; fi
            if [ -s grouped.md ]; then echo "## Changes"; echo; cat grouped.md; echo; fi
            echo "---"
            if [ "$MODE" = build ]; then echo "Built at the tag: this product's main CI does not upload a build yet."; fi
            if [ "$CI_SOURCE" = tag ]; then echo "Checked at the tag: main's CI result could not be read."; fi
            if [ -s release-dist/SHA256SUMS ]; then
              echo "Verify downloads with \`sha256sum --check SHA256SUMS\` and \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`."
            fi
            [ -n "$PREV" ] && echo "Full diff: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
          } > notes.md
          cat notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.gate.outputs.product }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$PRODUCT $TAG" --notes-file notes.md
          if [ -n "$(ls -A release-dist 2>/dev/null)" ]; then
            gh release upload "$TAG" release-dist/* --clobber
          fi

      # `deploy` is a script, or {"ssh_command": "<door>"}: the production host's forced-command
      # key, run as `ssh <ssh_user>@$PROD_HOST <door> <tag>`. Scripts see the same PROD_* values.
      - name: Deploy
        id: deploy
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          kind=$(jq -r '.deploy | type' "$CONFIG")
          if [ "$kind" = null ]; then echo "no deploy step for this product"; exit 0; fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          if [ "$kind" = string ]; then
            RELEASE_DIST="$PWD/release-dist" sh "$(jq -r .deploy "$CONFIG")"
            exit 0
          fi
          door=$(jq -r '.deploy.ssh_command // empty' "$CONFIG")
          [ -n "$door" ] || { echo "::error::deploy needs a script or ssh_command"; exit 1; }
          [ -n "$PROD_HOST" ] && [ -n "$PROD_SSH_KEY" ] && [ -n "$PROD_KNOWN_HOSTS" ] ||
            { echo "::error::the ssh deploy needs the PROD_HOST variable and the PROD_SSH_KEY and PROD_KNOWN_HOSTS secrets"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod && chmod 600 ~/.ssh/prod
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          user=$(jq -r '.deploy.ssh_user // "root"' "$CONFIG")
          ssh -i ~/.ssh/prod -o BatchMode=yes "$user@$PROD_HOST" "$door" "$TAG"
      - name: Smoke check
        id: smoke
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          script=$(jq -r '.smoke.script // empty' "$CONFIG")
          url=$(jq -r '.smoke.url // empty' "$CONFIG")
          tries=$(jq -r '.smoke.retries // 20' "$CONFIG")
          delay=$(jq -r '.smoke.delay_s // 10' "$CONFIG")
          [ -n "$script$url" ] || { echo "no smoke check configured"; exit 0; }
          i=0
          while [ "$i" -lt "$tries" ]; do
            if [ -n "$script" ]; then sh "$script" && exit 0
            else curl -fsS -o /dev/null --max-time 15 "$url" && exit 0; fi
            i=$((i + 1)); sleep "$delay"
          done
          echo "::error::smoke check failed after $tries tries"; exit 1
      - name: Roll back
        if: failure() && steps.deploy.outputs.deployed == 'true'
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          kind=$(jq -r '.rollback | type' "$CONFIG")
          if [ "$kind" = null ]; then echo "::error::the release failed and no rollback is configured"; exit 1; fi
          if [ "$kind" = string ]; then
            PREVIOUS_TAG="$PREV" sh "$(jq -r .rollback "$CONFIG")"
          else
            door=$(jq -r '.rollback.ssh_command // empty' "$CONFIG")
            [ -n "$door" ] && [ -n "$PREV" ] || { echo "::error::no ssh_command or no previous tag to roll back to"; exit 1; }
            install -d -m 700 ~/.ssh
            printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod && chmod 600 ~/.ssh/prod
            printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
            user=$(jq -r '.rollback.ssh_user // "root"' "$CONFIG")
            ssh -i ~/.ssh/prod -o BatchMode=yes "$user@$PROD_HOST" "$door" "$PREV"
          fi
          echo "::error::rolled back to ${PREV:-the previous release}; the release stays a draft"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
